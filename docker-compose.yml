# Runs the game server behind an existing Traefik. Copy .env.example to .env
# and set GAMES_HOST; Traefik must join the `games-proxy` network (see README).
services:
  games:
    build: .
    image: game-night:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${GAMES_HOST:?set GAMES_HOST in .env}
    # Isolation: no published ports, no host mounts, read-only filesystem,
    # no Linux capabilities, no privilege escalation, bounded resources.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    cpus: 1
    networks: [games-proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=games-proxy
      - traefik.http.routers.games.rule=Host(`${GAMES_HOST}`)
      - traefik.http.routers.games.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.games.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.games.loadbalancer.server.port=3000

networks:
  # Internal: Docker gives it no route out, so the container can reach only
  # what is attached here (Traefik), not the internet or your LAN.
  games-proxy:
    name: games-proxy
    internal: true
