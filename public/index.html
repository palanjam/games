<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15212e">
  <title>Game Night</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <header>
    <h1>Game <span>Night</span></h1>
    <p class="muted">Pick a game and start a lobby, or join one with its code.</p>
  </header>
  <form id="join">
    <input id="code" maxlength="4" placeholder="Room code" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button type="submit">Join</button>
  </form>
  <p id="msg" class="msg" hidden></p>
  <main id="games"><p class="muted">Loading games…</p></main>
  <script type="module" src="/home.js"></script>
</body>
</html>
